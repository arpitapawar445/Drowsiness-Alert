<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drowsiness Detection System</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: #121212;
        color: #e0e0e0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding-bottom: 80px;
      }

      header {
        width: 100%;
        text-align: center;
        padding: 20px 10px;
        font-size: 28px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(90deg, #8e2de2, #4a00e0);
        border-bottom-left-radius: 24px;
        border-bottom-right-radius: 24px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      }

      .stage-wrapper {
        width: 720px;
        max-width: 95%;
        height: 450px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(15px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        margin: 30px 0;
        position: relative;
        overflow: hidden;
      }

      .stage {
        width: 95%;
        height: 90%;
        background: #000;
        border-radius: 20px;
        overflow: hidden;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 8px 20px rgba(138, 43, 226, 0.5);
      }

      video,
      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 20px;
      }

      .hud {
        position: absolute;
        bottom: 16px;
        left: 16px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(10px);
        color: #fff;
        padding: 12px 16px;
        border-radius: 14px;
        font-weight: 600;
        font-size: 16px;
        display: flex;
        gap: 16px;
      }

      #status {
        position: absolute;
        top: 16px;
        right: 16px;
        background: #ff1744;
        color: #fff;
        padding: 14px 20px;
        border-radius: 16px;
        font-weight: 700;
        font-size: 18px;
        display: none;
        text-align: center;
        box-shadow: 0 0 20px rgba(255, 23, 68, 0.8);
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }

      .card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 16px 22px;
        border-radius: 20px;
        box-shadow: 0 8px 20px rgba(74, 0, 224, 0.5);
        font-weight: 600;
        font-size: 18px;
        margin-bottom: 20px;
        min-width: 180px;
        text-align: center;
        color: #fff;
      }

      .controls {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
      }

      button {
        padding: 14px 30px;
        border: none;
        border-radius: 50px; /* pill shape */
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        color: #fff;
        position: relative;
        overflow: hidden;
      }

      button#startBtn {
        background: linear-gradient(135deg, #00c853, #64dd17);
        box-shadow: 0 0 15px rgba(100, 221, 23, 0.5);
      }
      button#stopBtn {
        background: linear-gradient(135deg, #ff3b30, #ff1744);
        box-shadow: 0 0 15px rgba(255, 23, 68, 0.5);
      }

      /* Hover animation */
      button:hover {
        transform: translateY(-4px) scale(1.03);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
      }

      /* Press animation */
      button:active {
        transform: scale(0.97);
      }

      /* Disabled state */
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        box-shadow: none;
      }

      .live-badge {
        position: absolute;
        top: 16px;
        left: 16px;
        display: none;
        align-items: center;
        gap: 6px;
        background: rgba(255, 23, 68, 0.9);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        padding: 6px 12px;
        border-radius: 20px;
        box-shadow: 0 0 12px rgba(255, 23, 68, 0.8);
        animation: pulse 1.2s infinite;
      }
      .live-dot {
        width: 10px;
        height: 10px;
        background: #fff;
        border-radius: 50%;
        animation: blink 1s infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.3;
        }
      }

      footer {
        position: fixed;
        bottom: 0;
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        text-align: center;
        padding: 12px 0;
        font-size: 14px;
        color: #aaa;
        box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.1);
      }
      footer a {
        color: #8e2de2;
        text-decoration: none;
        font-weight: 600;
      }
      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>DROWSINESS DETECTION</header>

    <!-- Glass panel wrapper -->
    <div class="stage-wrapper">
      <div class="stage">
        <img id="stream" alt="video stream" />
        <div class="hud">
          <span>EAR: <span id="ear">--</span></span>
          <span>Eyes Closed: <span id="closed">0</span>s</span>
        </div>
        <div id="status">🚨 DROWSINESS ALERT!</div>

        <!-- 🔴 LIVE Badge -->
        <div class="live-badge" id="liveBadge">
          <div class="live-dot"></div>
          LIVE
        </div>
      </div>
    </div>

    <div class="card">Driver: <span id="driver">Verified ✅</span></div>

    <div class="controls">
      <button id="startBtn">▶ Start Camera</button>
      <button id="stopBtn" disabled>⏹ Stop Camera</button>
    </div>

    <!-- Alarm -->
    <audio id="alarmSound" preload="auto">
      <source src="/static/alarm1.mp3" type="audio/mpeg" />
      <source src="/static/alarm2.mp3" type="audio/mpeg" />
    </audio>

    <!-- Footer -->
    <footer>
      &copy; 2025 <a href="#">Arpita Pawar</a>. All rights reserved. |
      Designed with ❤️
    </footer>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
      const stream = document.getElementById("stream");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const earEl = document.getElementById("ear");
      const closedEl = document.getElementById("closed");
      const statusEl = document.getElementById("status");
      const driverEl = document.getElementById("driver");
      const alarmEl = document.getElementById("alarmSound");
      const liveBadge = document.getElementById("liveBadge");
      const socket = io();
      let alertWasActive = false;

      function speakAlert() {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const message = new SpeechSynthesisUtterance(
          "Warning. Driver drowsiness detected. Please take a break."
        );
        message.rate = 0.95;
        message.volume = 1;
        window.speechSynthesis.speak(message);
      }

      socket.on("update", (data) => {
        earEl.innerText = data.ear ?? "--";
        closedEl.innerText = data.eyes_closed ?? 0;
        driverEl.innerText = "Verified ✅";
        driverEl.style.color = "#00e676";

        if (data.alert) {
          statusEl.style.display = "block";
          if (!alertWasActive) speakAlert();
          alertWasActive = true;
          if (alarmEl.paused) {
            alarmEl.currentTime = 0;
            alarmEl.play().catch(() => {});
          }
        } else {
          statusEl.style.display = "none";
          if (!alarmEl.paused) {
            alarmEl.pause();
            alarmEl.currentTime = 0;
          }
          alertWasActive = false;
        }
      });

      startBtn.addEventListener("click", () => {
        stream.src = "/video_feed";
        startBtn.disabled = true;
        stopBtn.disabled = false;
        liveBadge.style.display = "flex"; // show live
      });

      stopBtn.addEventListener("click", () => {
        stream.src = "";
        startBtn.disabled = false;
        stopBtn.disabled = true;
        earEl.innerText = "--";
        closedEl.innerText = "0";
        statusEl.style.display = "none";
        alertWasActive = false;
        driverEl.innerText = "Verified ✅";
        if (!alarmEl.paused) {
          alarmEl.pause();
          alarmEl.currentTime = 0;
        }
        liveBadge.style.display = "none"; // hide live
      });
    </script>
  </body>
</html>
